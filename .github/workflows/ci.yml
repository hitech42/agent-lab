name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run mypy scripts/
      - run: uv run agent-lab report build --check
      - run: uv run pytest -m "slow or not slow"
      - run: uv run agent-lab validate-tasks

  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: /opt/agentlab/venv
      UV_PYTHON_INSTALL_DIR: /opt/agentlab/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Create /opt/agentlab for the venv and the Python install
        run: |
          sudo mkdir -p /opt/agentlab
          sudo chown "$USER" /opt/agentlab
      - run: uv python install
      - run: uv sync --locked
      - name: Create the sandbox user
        run: sudo scripts/setup_sandbox_user.sh
      - run: uv run pytest -m isolation
