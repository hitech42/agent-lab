name: Daily experiment

# Runs the day's experiment unattended and publishes its results to main.
# Two jobs on purpose: `experiment` executes agent code and holds the API key but can only
# read; `publish` can push but runs no agent code and never sees the key. The only thing that
# crosses between them is an artifact, which the publisher validates as untrusted input.

on:
  schedule:
    # A primary and a backup run on the same UTC day, at non-round minutes. GitHub starts
    # scheduled runs on a best-effort basis, so they can begin hours late. Both run the same
    # thing: --resume makes the second a no-op on a finished day and a continuation after an
    # abort, and `concurrency` below serializes them.
    - cron: "17 13 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan and estimate only: no API calls, nothing published"
        type: boolean
        default: false

concurrency:
  group: daily-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: experiment
    permissions:
      contents: read
    env:
      UV_PROJECT_ENVIRONMENT: /opt/agentlab/venv
      UV_PYTHON_INSTALL_DIR: /opt/agentlab/python
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
      artifact: ${{ steps.collect.outputs.artifact }}
      kind: ${{ steps.outcome.outputs.kind }}
      status: ${{ steps.outcome.outputs.status }}
      detail: ${{ steps.outcome.outputs.detail }}
      completed: ${{ steps.outcome.outputs.completed }}
      planned: ${{ steps.outcome.outputs.planned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Create /opt/agentlab for the venv and the Python install
        run: |
          sudo mkdir -p /opt/agentlab
          sudo chown "$USER" /opt/agentlab
      - run: uv python install
      - run: uv sync --locked
      - name: Create the sandbox user
        run: sudo scripts/setup_sandbox_user.sh
      - name: Run the experiment
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            uv run agent-lab run --resume --isolation linux-user --dry-run --outcome-file "$RUNNER_TEMP/outcome"
          else
            uv run agent-lab run --resume --isolation linux-user --outcome-file "$RUNNER_TEMP/outcome"
          fi
      - name: Expose the outcome
        id: outcome
        if: ${{ !cancelled() }}
        run: |
          # `agent-lab run` exits 0 for an abort too, so the outcome file is the only signal. Only
          # lines of the expected shape and a known kind get through (a missing or odd file is
          # "unknown"); the values can contain no newline, "%" or "::", and the counts are digits.
          raw="$RUNNER_TEMP/outcome"
          safe="$RUNNER_TEMP/outcome.safe"
          : > "$safe"
          if [ -f "$raw" ] && [ ! -L "$raw" ]; then
            grep -E "^((kind|status|detail)=[A-Za-z0-9 .,:_'()/-]*|(completed|planned)=[0-9]+)$" "$raw" \
              | grep -vF '::' > "$safe" || true
          fi
          if ! grep -qE '^kind=(abort|summary|already_done|dry_run)$' "$safe"; then
            printf 'kind=unknown\nstatus=unknown\ndetail=\n' > "$safe"
          fi
          cat "$safe" >> "$GITHUB_OUTPUT"
          if grep -qx 'kind=summary' "$safe" && grep -qx 'status=partial_budget' "$safe"; then
            completed="$(sed -n 's/^completed=\([0-9][0-9]*\)$/\1/p' "$safe")"
            planned="$(sed -n 's/^planned=\([0-9][0-9]*\)$/\1/p' "$safe")"
            echo "::warning title=Daily run hit the budget cap::completed ${completed:-?} of ${planned:-?} attempts before the daily cost cap stopped the run"
          fi
      - name: Collect new and changed result files
        id: collect
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/incoming"
          mkdir -p "$out"
          count=0
          cd results
          # Modified tracked files (appended JSONL) and untracked ones, one entry per file.
          # .transcripts/ is gitignored and outside results/, so it can never be listed.
          while IFS= read -r -d '' f; do
            if [ -L "$f" ] || [ ! -f "$f" ]; then
              echo "::error::unexpected non-regular result file: $f"
              exit 1
            fi
            mkdir -p "$out/$(dirname "$f")"
            cp -- "$f" "$out/$f"
            count=$((count + 1))
          done < <(git ls-files -z -m -o --exclude-standard -- runs configs)
          echo "$count result file(s) new or changed"
          if [ "$count" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "artifact=results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the result files
        if: ${{ !cancelled() && steps.collect.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: ${{ runner.temp }}/incoming
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: experiment
    if: ${{ !cancelled() && needs.experiment.outputs.changed == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require the commit author variables
        env:
          NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$NAME" ] || [ -z "$EMAIL" ]; then
            echo "::error::set the repository variables COMMIT_AUTHOR_NAME and COMMIT_AUTHOR_EMAIL"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.experiment.outputs.artifact }}
          path: ${{ runner.temp }}/incoming
      - name: Validate and copy the results into results/
        run: uv run agent-lab results publish "$RUNNER_TEMP/incoming"
      - name: Rebuild the README dashboard and the report
        run: uv run agent-lab report build
      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$(git status --porcelain -- results/)" ]; then
            echo "nothing new to commit"
            exit 0
          fi
          uv run agent-lab results commit-message "$RUNNER_TEMP/incoming" > "$RUNNER_TEMP/message"
          git add results/ report/ README.md
          git commit -F "$RUNNER_TEMP/message"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto main"
            git pull --rebase origin main
          done
          echo "::error::could not push to main after 3 attempts"
          exit 1

  # Every slot after the first of a UTC day finds the day finished and has nothing to publish.
  # This job gives such a run a commit of its own, so that each run shows on the contribution
  # graph: one line appended to results/heartbeat.log. Like `publish` it runs no agent code and
  # never sees the key; it only needs the author variables, so that GitHub credits the commit.
  heartbeat:
    needs: experiment
    if: ${{ !cancelled() && needs.experiment.result == 'success' && needs.experiment.outputs.changed == 'false' && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require the commit author variables
        env:
          NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$NAME" ] || [ -z "$EMAIL" ]; then
            echo "::error::set the repository variables COMMIT_AUTHOR_NAME and COMMIT_AUTHOR_EMAIL"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - name: Append a line to the heartbeat log, commit and push
        env:
          GIT_AUTHOR_NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
        run: |
          day="$(date -u +%F)"
          echo "$(date -u +%FT%TZ) run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}: no new results for ${day}" >> results/heartbeat.log
          git add results/heartbeat.log
          git commit -m "chore(heartbeat): no new results for ${day} (run ${GITHUB_RUN_ID})"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto main"
            git pull --rebase origin main
          done
          echo "::error::could not push to main after 3 attempts"
          exit 1

  # The run exits 0 for an abort so that its record is still collected and published; this job
  # runs after `publish` and turns the bad outcomes into a failed run, which GitHub notifies about.
  # `!cancelled()` makes it evaluate even when publish was skipped. It stays skipped on green runs.
  alert:
    needs: [experiment, publish]
    if: ${{ !cancelled() && inputs.dry_run != true && (needs.experiment.outputs.kind == 'abort' || needs.experiment.outputs.status == 'aborted_tampered' || (needs.experiment.result == 'success' && needs.experiment.outputs.kind == 'unknown') || needs.publish.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail with the reason
        env:
          KIND: ${{ needs.experiment.outputs.kind }}
          STATUS: ${{ needs.experiment.outputs.status }}
          DETAIL: ${{ needs.experiment.outputs.detail }}
          COMPLETED: ${{ needs.experiment.outputs.completed }}
          PLANNED: ${{ needs.experiment.outputs.planned }}
          EXPERIMENT: ${{ needs.experiment.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          counts=""
          if [ -n "$COMPLETED" ] && [ -n "$PLANNED" ]; then counts=" (completed $COMPLETED of $PLANNED attempts)"; fi
          if [ "$KIND" = "abort" ]; then
            echo "::error title=Daily run aborted::${STATUS}${DETAIL:+: $DETAIL}${counts}; the day stays resumable"
          elif [ "$STATUS" = "aborted_tampered" ]; then
            echo "::error title=Daily run ended aborted_tampered::the environment was tampered with${counts}; the day is final"
          fi
          if [ "$KIND" = "unknown" ] && [ "$EXPERIMENT" = "success" ]; then
            echo "::error title=Daily run reported no outcome::run finished without reporting an outcome"
          fi
          if [ "$PUBLISH" = "failure" ]; then
            echo "::error title=Publishing failed::the results were not published to main; the artifact is kept for 3 days"
          fi
          exit 1
