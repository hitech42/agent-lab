[project]
name = "agent-lab"
version = "0.1.0"
description = "A hand-written LLM agent harness plus a daily automated experiment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "pydantic",
    "pyyaml",
]

[project.scripts]
agent-lab = "agent_lab.runner.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Task fixtures are data (some intentionally buggy); they are not linted or collected.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Helper modules (not conftests) shared between test directories: task_builders, runner_support.
pythonpath = ["tests/benchmark", "tests/runner"]
markers = ["slow: spawns real pytest subprocesses (deselected by default; CI runs everything)"]
addopts = "-m 'not slow'"
