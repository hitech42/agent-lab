id: fix-invoice-rounding
title: Make the invoicing package follow its docstrings
category: bugfix
difficulty: hard
prompt: |
  This package builds and prints invoices. The docstrings of `money`, `catalog`, `discounts`
  and `tax` define how every amount is worked out (`money` has the rounding conventions
  that apply everywhere); `pricing` and `invoice` put those rules together. Make the
  package follow its docstrings. Run the tests in `tests/` to check your work, and do not
  edit the tests.
grading: hidden_tests
