id: refactor-exporter
title: Split a long exporter module without changing what it does
category: refactor
difficulty: hard
prompt: |
  `export.py` has grown into one long module that renders rows (a list of dicts) as
  aligned text, CSV or a Markdown table. Refactor it into smaller modules as its module
  docstring describes, without changing what it does: `export.export(...)` and
  `export.main(...)` keep their signatures and their behaviour exactly, including every
  error message and every detail described in their docstrings. The code as it is today is
  the specification, not only what its docstrings say: for every input, `export.export(...)`
  and `export.main(...)` must return, print and raise exactly what they do now, error
  messages and exit codes included.

  Run the tests in `tests/` to check your work, and do not edit the tests.
grading: hidden_tests
